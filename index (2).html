k}\nbody{font-family:Inter,system-ui,-apple-system,\"Segoe UI\",sans-serif}#role{display:none}\n.hero{background:var(--card)!important;border:1px solid var(--line);box-shadow:none!important;color:var(--ink)}.hero:after{display:none}.chips2 span{background:#0f5656!important}\n.sec,.card{border:1px solid var(--line);border-radius:18px;box-shadow:none}.sec h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}\n.dp.on small,.dp.on b,.btn.p,.rt button,.tx.me .ic,.av,.seg button.on{color:#04132e!important}.tabs{box-shadow:none;border-top:1px solid var(--line)}\n.hd{margin:-16px -16px 16px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg)}.hd .av{order:3;width:32px;height:32px}.hi{order:1}.hi small{font-size:19px;font-weight:800;color:var(--ink);opacity:1;display:block}#hello{display:none}.hi small{white-space:nowrap}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\" id=\"app\">\u003cdiv class=\"wrap\">\n\u003cheader class=\"hd\">\u003cdiv class=\"av\" id=\"av\">C\u003c/div>\u003cdiv class=\"hi\">\u003csmall>\u2726 Cornerstore Scedule\u003c/small>\u003cb id=\"hello\">\u003c/b>\u003c/div>\u003c/header>\u003cdiv style=\"margin-bottom:14px\">\u003cselect id=\"fil\" aria-label=\"Filiale\" style=\"max-width:none;width:100%\">\u003c/select>\u003c/div>\n\u003cdiv class=\"seg\" id=\"role\">\u003cbutton data-r=\"chef\" class=\"on\">Chef\u003c/button>\u003cbutton data-r=\"ma\">Mitarbeiter (Anna)\u003c/button>\u003c/div>\n\u003cdiv id=\"view\">\u003c/div>\u003c/div>\n\u003cnav class=\"tabs\">\u003cbutton class=\"nav on\" data-v=\"plan\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/>\u003cpath d=\"M8 3v4M16 3v4M3 10h18\"/>\u003c/svg>Plan\u003c/button>\u003cbutton class=\"nav\" data-v=\"mine\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/svg>Meine\u003c/button>\u003cbutton class=\"nav\" data-v=\"vac\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>\u003c/svg>Urlaub\u003c/button>\u003cbutton class=\"nav chef\" data-v=\"stat\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 20V10M12 20V4M19 20v-7\"/>\u003c/svg>Statistik\u003c/button>\u003cbutton class=\"nav chef\" data-v=\"set\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/>\u003c/svg>Einstellungen\u003c/button>\u003c/nav>\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\">\u003cdiv class=\"card\">\n \u003ch2>Schichten anlegen\u003c/h2>\n \u003cdiv class=\"f\">\u003clabel>Wochentag\u003c/label>\u003cselect id=\"mDay\">\u003c/select>\u003c/div>\n \u003cdiv class=\"f\">\u003clabel>Beginn\u003c/label>\u003cinput id=\"mS\" type=\"time\" value=\"16:00\">\u003c/div>\n \u003cdiv class=\"f\">\u003clabel>Ende\u003c/label>\u003cinput id=\"mE\" type=\"time\" value=\"22:00\">\u003c/div>\n \u003cdiv class=\"f\">\u003clabel>Fest vergeben an\u003c/label>\u003cselect id=\"mP\">\u003c/select>\u003c/div>\n \u003cp class=\"empty\" style=\"margin:0 0 12px\">Die Schicht setzt sich automatisch an jedem passenden Kalendertag fort.\u003c/p>\n \u003cdiv style=\"display:flex;gap:8px;justify-content:flex-end\">\u003cbutton class=\"btn\" id=\"mX\">Abbrechen\u003c/button>\u003cbutton class=\"btn p\" id=\"mOk\">Schicht speichern\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\nconst D=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];\nlet S={sel:0,fil:['Friedrichshain','Kreuzberg'],cur:'Friedrichshain',role:'chef',view:'plan',\n staff:[],\n sh:[],claims:{},rel:{},id:1,vac:[],vid:1};\nfunction add(f,d,s,e,p){S.sh.push({id:S.id++,f,d,s,e,p:p||null})}\n[0,1,2,3,4].forEach(d=>add('Friedrichshain',d,'16:00','22:00',d==0?'Ben':null));\n[3,4,5].forEach(d=>add('Friedrichshain',d,'22:00','02:00',d==5?'Dana':null));\nadd('Friedrichshain',5,'14:00','22:00',null);add('Friedrichshain',6,'14:00','22:00','Cem');\n[1,3,5].forEach(d=>add('Kreuzberg',d,'17:00','23:00',null));\nif(window.CS){if(CS.real&&!localStorage.getItem('cs_sched'))S.sh.forEach(x=>{x.p=null});S.staff=CS.users.filter(u=>!u.admin&&u.roles.sched==='staff').map(u=>({n:u.name,r:'Mitarbeiter'}));S.role=(CS.me.admin||CS.me.roles.sched==='chef')?'chef':'ma';try{const z=JSON.parse(localStorage.getItem('cs_sched'));if(z){S.sh=z.sh||S.sh;S.claims=z.claims||{};S.rel=z.rel||{};S.vac=z.vac||[];S.vid=z.vid||1;S.id=z.id||S.id;S.fil=z.fil||S.fil;S.cur=z.cur||S.cur}}catch(e){}}\nconst $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');\nconst mon=(()=>{const d=new Date(2026,9,12);return d})();\nconst dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();\nconst dateOf=i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d};\nconst hrs=(s,e)=>{let a=s.split(':'),b=e.split(':'),x=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(x\u003c=0)x+=1440;return x/60};\nconst iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());\nconst raw=(sh,d)=>{const k=dkey(d)+'#'+sh.id;return S.claims[k]||(S.rel[k]?null:sh.p)||null};\nconst onVac=(n,d)=>{const x=iso(d);return S.vac.some(v=>v.st=='ok'&&v.who==n&&x>=v.from&&x\u003c=v.to)};\nconst who=(sh,d)=>{const w=raw(sh,d);return w&&onVac(w,d)?null:w};\nconst vacBy=(sh,d)=>{const w=raw(sh,d);return w&&onVac(w,d)?w:null};\nif(window.CS&&CS.filialen&&CS.filialen.length){const nm=CS.filialen.map(f=>f.n);S.fil=nm;S.sh=S.sh.filter(x=>nm.includes(x.f));if(!nm.includes(S.cur))S.cur=nm[0]}\nconst me=()=>S.role=='chef'?null:(window.CS?CS.me.name:'Anna');\nfunction toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}\nfunction stats(){const wk={},mo={};S.staff.forEach(p=>{wk[p.n]=0;mo[p.n]=0});\n S.sh.filter(s=>s.f==S.cur).forEach(s=>{\n  for(let i=0;i\u003c7;i++){const w=who(s,dateOf(i));if(w&&i==s.d)wk[w]=(wk[w]||0)+hrs(s.s,s.e)}\n  const last=new Date(2026,10,0).getDate();\n  for(let n=1;n\u003c=last;n++){const d=new Date(2026,9,n),wd=(d.getDay()+6)%7;if(wd!=s.d)continue;const w=who(s,d);if(w)mo[w]=(mo[w]||0)+hrs(s.s,s.e)}\n });return{wk,mo}}\nfunction nf(x){return Math.round(x*10)/10}\nfunction render(){try{localStorage.setItem('cs_sched',JSON.stringify({sh:S.sh,claims:S.claims,rel:S.rel,id:S.id,fil:S.fil,cur:S.cur,vac:S.vac,vid:S.vid}))}catch(e){}\n document.documentElement.classList.toggle('isChef',S.role=='chef');$('#app').classList.toggle('isChef',S.role=='chef');\n if(S.role!='chef'&&(S.view=='stat'||S.view=='set'))S.view='plan';\n document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v==S.view));\n $('#fil').innerHTML=S.fil.map(f=>`\u003coption ${f==S.cur?'selected':''}>${f}\u003c/option>`).join('');\n document.querySelectorAll('#role button').forEach(b=>b.classList.toggle('on',b.dataset.r==S.role));\n $('#hello').textContent='Hallo, '+(window.CS?CS.me.name:'Anna');$('#av').textContent=(window.CS?CS.me.name:'A')[0];\n const t={mine:'Meine Schichten',vac:'Urlaub',stat:'Statistik',set:'Einstellungen'}[S.view];\n $('#view').innerHTML=S.view=='plan'?plan():`\u003ch1 class=\"pt\">${t}\u003c/h1>`+(S.view=='mine'?mineV():S.view=='vac'?vacV():S.view=='stat'?statV():setV());\n}\nfunction mineList(){const out=[];\n S.sh.filter(s=>s.f==S.cur).forEach(s=>{const d=dateOf(s.d);if(me()&&who(s,d)==me())out.push([d,s])});\n return out.sort((a,b)=>a[0]-b[0])}\nfunction mh(){let w=0,m=0;S.sh.forEach(s=>{const h=hrs(s.s,s.e);if(who(s,dateOf(s.d))==me())w+=h;for(let n=1;n\u003c=31;n++){const d=new Date(2026,9,n);if(d.getMonth()!=9)break;if((d.getDay()+6)%7==s.d&&who(s,d)==me())m+=h}});return{w,m}}\nfunction hero(){let lab,big,c1,c2;\n if(S.role=='chef'){const{wk,mo}=stats();const w=Object.values(wk).reduce((a,b)=>a+b,0),m=Object.values(mo).reduce((a,b)=>a+b,0);let o=0;S.sh.filter(s=>s.f==S.cur).forEach(s=>{if(!who(s,dateOf(s.d)))o++});lab='Teamstunden diese Woche';big=nf(w);c1='Monat: '+nf(m)+' Std.';c2=o+' offen'}\n else{const{w,m}=mh();const n=mineList()[0];lab='Deine Stunden diese Woche';big=nf(w);c1='Monat: '+nf(m)+' Std.';c2=n?'N\u00e4chste: '+D[n[1].d].slice(0,2)+' '+n[1].s:'Keine Schicht'}\n return `\u003cdiv class=\"hero\">\u003csmall>${lab}\u003c/small>\u003cdiv class=\"big\">${big}\u003cspan> Std.\u003c/span>\u003c/div>\u003cdiv class=\"chips2\">\u003cspan>${c1}\u003c/span>\u003cspan>${c2}\u003c/span>\u003c/div>\u003c/div>`}\nfunction strip(){let h='\u003cdiv class=\"strip\">';for(let i=0;i\u003c7;i++){const d=dateOf(i);h+=`\u003cbutton class=\"dp ${i==S.sel?'on':''}\" data-sel=\"${i}\">\u003csmall>${D[i].slice(0,2)}\u003c/small>\u003cb>${d.getDate()}\u003c/b>\u003c/button>`}return h+'\u003c/div>'}\nfunction dayList(){const i=S.sel,d=dateOf(i);let c='';\n S.sh.filter(s=>s.f==S.cur&&s.d==i).sort((a,b)=>a.s.localeCompare(b.s)).forEach(s=>{\n  const w=who(s,d),vb=vacBy(s,d),isMe=me()&&w==me(),h=nf(hrs(s.s,s.e)),k=`data-d=\"${i}\"`,rel=S.rel[dkey(d)+'#'+s.id];\n  let cls='free',sub,btn='';\n  if(S.role=='chef'){cls=w?'oth':'free';sub=w?w+(w==s.p?' \u00b7 fest':''):'Noch frei'+(vb?' \u00b7 '+vb+' im Urlaub':'');btn=w?`\u003cbutton data-un=\"${s.id}\" ${k}>Freigeben\u003c/button>`:`\u003cbutton data-as=\"${s.id}\" ${k}>Zuweisen\u003c/button>`}\n  else if(isMe){cls='me';sub='Deine Schicht'+(w==s.p?' \u00b7 fest':'');btn=`\u003cbutton data-un=\"${s.id}\" ${k}>Abgeben\u003c/button>`}\n  else if(!w){sub=vb?'Frei \u00b7 Vertretung f\u00fcr '+vb+' (Urlaub)':rel?'Freigegeben':'Frei';btn=`\u003cbutton data-cl=\"${s.id}\" ${k}>\u00dcbernehmen\u003c/button>`}\n  else return;\n  c+=`\u003cdiv class=\"tx ${cls}\">\u003cdiv class=\"ic\">${s.s.slice(0,2)}\u003c/div>\u003cdiv class=\"tt\">\u003cb>${s.s}\u2013${s.e}\u003c/b>\u003csmall>${sub}\u003c/small>\u003c/div>\u003cdiv class=\"rt\">\u003cb>${isMe?'+':''}${h} Std.\u003c/b>${btn}\u003c/div>\u003c/div>`});\n return `\u003cdiv class=\"sec\">\u003ch2>${D[i]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.\u003c/h2>${c||'\u003cdiv class=\"empty\">Keine Schicht an diesem Tag\u003c/div>'}\u003c/div>`+openList()+(S.role=='chef'?'\u003cbutton class=\"btn p wide\" id=\"new\">+ Schicht anlegen\u003c/button>':'')}\nfunction openList(){const fw=S.fw|0,rows=[];for(let i=0;i\u003c7;i++){const d=dateOf(i+7*fw);S.sh.filter(s=>s.f==S.cur&&s.d==i).sort((a,b)=>a.s.localeCompare(b.s)).forEach(s=>{if(who(s,d))return;const k=`data-d=\"${i+7*fw}\"`;rows.push(`\u003cdiv class=\"tx free\">\u003cdiv class=\"ic\">${D[i].slice(0,2)}\u003c/div>\u003cdiv class=\"tt\">\u003cb>${D[i].slice(0,2)}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}. \u00b7 ${s.s}\u2013${s.e}\u003c/b>\u003csmall>${nf(hrs(s.s,s.e))} Std.${vacBy(s,d)?' \u00b7 Vertretung f\u00fcr '+vacBy(s,d)+' (Urlaub)':''}\u003c/small>\u003c/div>\u003cdiv class=\"rt\">${S.role=='chef'?`\u003cbutton data-as=\"${s.id}\" ${k}>Zuweisen\u003c/button>`:`\u003cbutton data-cl=\"${s.id}\" ${k}>\u00dcbernehmen\u003c/button>`}\u003c/div>\u003c/div>`)})}\nreturn `\u003cdiv class=\"sec\">\u003ch2>Freie Schichten (${rows.length})\u003c/h2>\u003cdiv class=\"seg\" style=\"margin:8px 0 6px\">\u003cbutton data-fw=\"0\" class=\"${fw?'':'on'}\">Diese Woche\u003c/button>\u003cbutton data-fw=\"1\" class=\"${fw?'on':''}\">N\u00e4chste Woche\u003c/button>\u003c/div>${rows.join('')||'\u003cdiv class=\"empty\">Alle Schichten sind vergeben.\u003c/div>'}\u003c/div>`}\nfunction plan(){return hero()+strip()+dayList()}\nfunction mineV(){if(S.role=='chef')return '\u003cdiv class=\"card empty\">Als Chef vergibst du Schichten im Plan.\u003c/div>';\n const l=mineList(),{w,m}=mh();\n return `\u003cdiv class=\"g2\">\u003cdiv class=\"card\">\u003csmall class=\"mut\">Diese Woche\u003c/small>\u003cdiv class=\"num\">${nf(w)} Std.\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003csmall class=\"mut\">Dieser Monat\u003c/small>\u003cdiv class=\"num\">${nf(m)} Std.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"sec\">\u003ch2>N\u00e4chste Schichten\u003c/h2>${l.length?l.map(([d,s])=>`\u003cdiv class=\"tx me\">\u003cdiv class=\"ic\">${s.s.slice(0,2)}\u003c/div>\u003cdiv class=\"tt\">\u003cb>${D[s.d]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.\u003c/b>\u003csmall>${s.s}\u2013${s.e} \u00b7 ${s.f}\u003c/small>\u003c/div>\u003cdiv class=\"rt\">\u003cb>${nf(hrs(s.s,s.e))} Std.\u003c/b>\u003c/div>\u003c/div>`).join(''):'\u003cdiv class=\"empty\">Noch keine Schicht. \u00dcbernimm eine freie im Plan.\u003c/div>'}\u003c/div>`}\nconst VS={pending:['Offen','#e8962e'],ok:['Genehmigt','#13a58c'],no:['Abgelehnt','#e0507f']};\nconst fdv=s=>s.slice(8,10)+'.'+s.slice(5,7)+'.';\nconst chip=st=>`\u003cspan style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:${VS[st][1]}33;color:${VS[st][1]}\">${VS[st][0]}\u003c/span>`;\nfunction affected(v){let n=0;const b=new Date(v.to+'T12:00');for(let d=new Date(v.from+'T12:00'),c=0;d\u003c=b&&c\u003c120;d.setDate(d.getDate()+1),c++){const wd=(d.getDay()+6)%7;S.sh.forEach(s=>{if(s.d==wd&&raw(s,d)==v.who)n++})}return n}\nfunction vacV(){const chef=S.role=='chef',L=[...S.vac].sort((a,b)=>a.from\u003cb.from?-1:1);\nconst row=(v,btns)=>`\u003cdiv class=\"tx\">\u003cdiv class=\"ic\">${v.who[0]}\u003c/div>\u003cdiv class=\"tt\">\u003cb>${chef?v.who+' \u00b7 ':''}${fdv(v.from)} \u2013 ${fdv(v.to)}${v.to.slice(0,4)}\u003c/ async function pullData(){if(!H.sid)return;await pushNow();for(const k of DK){const {data}=await sbh.from('store_data').select('value').eq('store_id',H.sid).eq('key',k).maybeSingle();try{if(data)localStorage.setItem(k,JSON.stringify(data.value));else localStorage.removeItem(k);LAST[k]=localStorage.getItem(k)}catch(e){}}try{localStorage.removeItem('cs_shop_summary')}catch(e){}}
async function pushNow(){if(!H.sid)return;for(const k of DK){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v&&v!==LAST[k]){LAST[k]=v;const {error}=await sbh.from('store_data').upsert({store_id:H.sid,key:k,value:JSON.parse(v),updated_by:H.me,updated_at:new Date().toISOString()});if(error)LAST[k]=null}}}
if(REAL){setInterval(()=>{pushNow().catch(()=>{})},4000);sbh.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){V.recover=true;render()}else if(ev==='SIGNED_OUT'&&H.me){H.me=null;H.sid=null;V.auth='login';reset();render()}})}
async function afterAuth(){V.boot=true;render();try{await loadStore();if(H.me)await pullData()}catch(e){V.err='Verbindung fehlgeschlagen. Bitte versuche es noch einmal.'}V.boot=false;V.s='home';if(!H.me&&V.err&&!V.noOrg)toast(V.err);render()}
async function boot(){const q=new URLSearchParams(location.search).get('invite');if(q){V.inv=q;V.auth='join'}await afterAuth();const h=location.hash.slice(1);if(me()&&AR[h]&&eff(me(),h)!=='none'){V.s='app';V.k=h;render()}}
async function outReal(){try{await syncOut();await pushNow()}catch(e){}await sbh.auth.signOut();V.noOrg=false;H.me=null;H.sid=null;H.users=[];['planly3','cs_sched','cs_shop_summary'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});reset();V.s='home';V.auth='login';render()}
const val=id=>($('#'+id)||{value:''}).value.trim();
async function aLogin(){const {error}=await sbh.auth.signInWithPassword({email:val('ae1').toLowerCase(),password:$('#ap1').value});if(error){toast('Anmeldung fehlgeschlagen: '+error.message);return}await afterAuth()}
async function aSign(kind){const n=val('an1'),e=val('ae2').toLowerCase(),p=$('#ap2').value,x=kind==='store'?val('as2'):val('ac2');if(!n||!e||!x){toast('Bitte alle Felder ausfüllen');return}if(p.length<8){toast('Das Passwort braucht mindestens 8 Zeichen');return}
const {data,error}=await sbh.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname,data:kind==='store'?{name:n,store_name:x}:{name:n,invite:x}}});if(error){toast('Registrierung fehlgeschlagen: '+error.message);return}
if(data.session)await afterAuth();else{V.auth='confirm';render()}}
async function aForgot(){const e=val('ae1').toLowerCase();if(!e){toast('Bitte E-Mail eintragen');return}const {error}=await sbh.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});toast(error?'Fehler: '+error.message:'Wir haben dir einen Link geschickt.');if(!error){V.auth='login';render()}}
async function aRecover(){const p=$('#ap3').value;if(p.length<8){toast('Das Passwort braucht mindestens 8 Zeichen');return}const {error}=await sbh.auth.updateUser({password:p});if(error){toast('Fehler: '+error.message);return}V.recover=false;toast('Passwort gespeichert');await afterAuth()}
async function aSetup(){const n=val('so1'),o=val('so2');if(!n||!o){toast('Bitte Name und Organisation eintragen');return}const {error}=await sbh.rpc('create_store',{store_name:o,my_name:n});if(error){V.err=error.message;render();return}V.err='';await afterAuth()}
async function aJoinCode(){const c=val('so3');if(!c){toast('Bitte den Einladungscode eintragen');return}const {error}=await sbh.rpc('accept_invite',{invite_code:c});if(error){V.err=error.message;render();return}V.err='';await afterAuth()}
function authH(){const m=V.recover?'recover':V.noOrg?'setup':V.auth||'login',f=(id,l,t,v)=>`<label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v||'')}" autocomplete="off">`,lk=(a,t)=>`<a href="#" onclick="V.auth='${a}';render();return false">${t}</a>`,h=t=>`<h3 style="margin:0 0 10px;font-size:18px;text-transform:none;letter-spacing:0;color:var(--tx)">${t}</h3>`,bt=(c,t)=>`<button class="btn p w" style="margin-top:16px" onclick="${c}">${t}</button>`;let b;
if(V.boot)b='<p class="sub">Lädt …</p>';
else if(m==='confirm')b=`${h('Fast geschafft')}<p class="sub">Wir haben dir eine E-Mail geschickt. Bestätige sie und melde dich danach an.</p>${bt("V.auth='login';render()",'Zur Anmeldung')}`;
else if(m==='reg')b=`${h('Neue Organisation erstellen')}${f('an1','Dein Name')}${f('as2','Name der Organisation')}${f('ae2','E-Mail','email')}${f('ap2','Passwort (mind. 8 Zeichen)','password')}${bt("aSign('store')",'Organisation erstellen')}<p class="sub" style="margin-top:14px">${lk('login','Zurück zur Anmeldung')}</p>`;
else if(m==='join')b=`${h('Einladung annehmen')}${f('an1','Dein Name')}${f('ae2','E-Mail (die, an die die Einladung ging)','email')}${f('ap2','Passwort (mind. 8 Zeichen)','password')}${f('ac2','Einladungscode',0,V.inv)}${bt("aSign('join')",'Konto anlegen')}<p class="sub" style="margin-top:14px">${lk('login','Zurück zur Anmeldung')}</p>`;
else if(m==='forgot')b=`${h('Passwort vergessen')}${f('ae1','E-Mail','email')}${bt('aForgot()','Link senden')}<p class="sub" style="margin-top:14px">${lk('login','Zurück zur Anmeldung')}</p>`;
else if(m==='setup')b=`${h('Fast fertig')}<p class="sub">Dein Konto gehört noch zu keiner Organisation.</p>${V.err?`<p class="sub" style="color:#ff7a85">${esc(V.err)}</p>`:''}${f('so1','Dein Name')}${f('so2','Name der Organisation')}${bt('aSetup()','Organisation erstellen')}<div class="ms"></div>${f('so3','Oder: Einladungscode',0,V.inv)}<button class="btn w" style="margin-top:10px" onclick="aJoinCode()">Einladung annehmen</button><p class="sub" style="margin-top:14px"><a href="#" onclick="outReal();return false">Abmelden</a></p>`;
else if(m==='recover')b=`${h('Neues Passwort')}${f('ap3','Neues Passwort (mind. 8 Zeichen)','password')}${bt('aRecover()','Speichern')}`;
else b=`<p class="sub" style="margin:4px 0 14px">Melde dich an, dann stehen dir deine Bereiche offen.</p>${V.err?`<p class="sub" style="color:#ff7a85">${esc(V.err)}</p>`:''}${f('ae1','E-Mail','email')}${f('ap1','Passwort','password')}${bt('aLogin()','Anmelden')}<p class="sub" style="margin-top:14px">${lk('forgot','Passwort vergessen')}</p><div class="ms"></div><button class="btn w" onclick="V.auth='reg';render()">Neue Organisation erstellen</button><button class="btn w" style="margin-top:8px" onclick="V.auth='join';render()">Ich habe eine Einladung</button>`;
return `<div class="login"><div class="lc"><div class="logo" style="font-size:26px;cursor:default;margin-bottom:8px">✦ Cornerstore</div>${b}</div></div>`}
function inviteCard(){const L=H.invites||[];return `<div class="card"><h3>Mitarbeiter einladen</h3><div class="rg"><div><label>Name</label><input id="in1" placeholder="z. B. Lena"></div><div><label>E-Mail</label><input id="ie1" type="email" placeholder="lena@mail.de"></div></div><p class="sub">Die Person bekommt einen Link und registriert sich damit mit genau dieser E-Mail-Adresse. Danach erscheint sie oben, und du vergibst ihre Rollen.</p><button class="btn p" onclick="invite()">Einladung erstellen</button>${L.length?`<h3 style="margin-top:18px">Offene Einladungen</h3>`+L.map(i=>`<div class="row" style="border-bottom:1px solid var(--bd)"><div style="flex:1"><b>${esc(i.name||i.email)}</b><div class="sub">${esc(i.email)}</div></div><button class="btn" onclick="shareInv('${i.code}')">Link teilen</button><button class="btn d" onclick="delInv('${i.code}')">Löschen</button></div>`).join(''):''}</div>`}
async function invite(){const n=val('in1'),e=val('ie1').toLowerCase();if(!n||!e){toast('Name und E-Mail eintragen');return}if(H.users.some(u=>u.email.toLowerCase()===e)){toast('Diese Person ist schon dabei');return}
const {data,error}=await sbh.from('invites').insert({store_id:H.sid,email:e,name:n}).select().single();if(error){toast('Fehler: '+error.message);return}H.invites=[...(H.invites||[]),data];render();shareInv(data.code)}
function shareInv(c){const t=`Du bist zu ${H.company} bei Cornerstore eingeladen. Registriere dich hier: ${location.origin+location.pathname}?invite=${c}`,cp=()=>{try{navigator.clipboard.writeText(t).then(()=>toast('Einladungslink kopiert'),()=>prompt('Einladungslink kopieren:',t))}catch(e){prompt('Einladungslink kopieren:',t)}};if(navigator.share)navigator.share({text:t}).catch(cp);else cp()}
async function delInv(c){await sbh.from('invites').delete().eq('code',c);H.invites=H.invites.filter(i=>i.code!==c);render()}
function orgForm(){return `<div class="login"><div class="lc"><div class="logo" style="font-size:26px;cursor:default;margin-bottom:8px">✦ Cornerstore</div><h3 style="margin:0 0 6px;font-size:18px;text-transform:none;letter-spacing:0;color:var(--tx)">Neue Organisation erstellen</h3><p class="sub" style="margin:0 0 10px">Die neue Organisation startet ohne Daten, du bist ihr Admin.</p><label>Dein Name</label><input id="on1" autocomplete="off"><label>Name der Organisation</label><input id="on2" autocomplete="off"><label>E-Mail</label><input id="on3" type="email" autocomplete="off"><label>Passwort</label><input id="on4" type="password" autocomplete="off"><button class="btn p w" style="margin-top:16px" onclick="newOrg()">Organisation erstellen</button><p class="sub" style="margin-top:14px"><a href="#" onclick="V.org=false;render();return false">Zurück zur Anmeldung</a></p></div></div>`}
function newOrg(){const n=val('on1'),o=val('on2'),e=val('on3').toLowerCase();if(!n||!o||!e){toast('Bitte alle Felder ausfüllen');return}if(!confirm('Die bisherigen Demo-Daten werden dabei ersetzt. Fortfahren?'))return;
const id='u'+Math.random().toString(36).slice(2,8);H={me:id,company:o,co:{},off:{},dash:{},filialen:[{n:'Hauptfiliale',a:''}],empty:true,users:[{id,name:n,email:e,color:COL[0],admin:true,roles:{shop:'none',plan:'none',sched:'none'}}]};
['planly3','cs_sched','cs_shop_summary','cs_order_fil'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}});V.org=false;save();reset();V.s='home';render();toast('Organisation erstellt')}
function profH(u){return`<button class="btn" onclick="go('home')">← Zurück</button><h2 style="margin:14px 0 14px">Mein Profil</h2><div class="card"><div class="row">${av(u,56)}<div><b style="font-size:18px">${esc(u.name)}</b>${u.admin?' <span class="pill">Admin</span>':''}<div class="sub">${esc(u.email)}</div></div></div><label>Anzeigename</label><div style="display:flex;gap:8px"><input id="pn" value="${esc(u.name)}"><button class="btn p" onclick="saveName()">Speichern</button></div></div>
<div class="card"><h3>Meine Rollen</h3>${Object.entries(AR).map(([k,a])=>`<div class="row"><i style="width:10px;height:10px;border-radius:50%;background:${a.c}"></i><span style="flex:1">${a.t}</span><span class="pill">${u.admin?'Admin':rl(k,u.roles[k])}</span></div>`).join('')}</div><button class="btn d" onclick="logout()">Abmelden</button>`}
function saveName(){const n=$('#pn').value.trim();if(!n)return;me().name=n;save();reset();toast('Gespeichert');render()}
function setH(){const b=V.sub;if(b==='team')return teamH();if(b==='areas')return areasH();if(b==='company')return compH();if(b==='filialen')return filH();
return`<button class="btn" onclick="go('home')">← Zurück</button><h2 style="margin:14px 0 4px">Einstellungen</h2><p class="sub" style="margin:0 0 16px">Wähle, was du einstellen willst.</p>${[['team','👥','Team &amp; Rollen','Personen und ihre Rollen je Bereich'],['areas','🧩','Bereiche','Shopping, Planer und Scedule ein- oder ausblenden'],['filialen','📍','Filialen','Standorte für Scedule und Bestellungen'],['company','🏢','Mein Unternehmen','Name, Adresse, Steuernummer']].map(x=>`<button class="mi card" style="width:100%;margin-bottom:10px;padding:16px" onclick="V.sub='${x[0]}';render()"><span style="font-size:22px">${x[1]}</span><span style="flex:1"><b>${x[2]}</b><div class="sub">${x[3]}</div></span><span>›</span></button>`).join('')}`}
const back=()=>`<button class="btn" onclick="V.sub=null;render()">← Zurück</button>`;
function areasH(){return`${back()}<h2 style="margin:14px 0 4px">Bereiche</h2><p class="sub" style="margin:0 0 16px">Blende Bereiche für das ganze Unternehmen aus oder ein.</p><div class="card">${Object.entries(AR).map(([k,a])=>`<label style="display:flex;align-items:center;gap:10px;margin:0;padding:10px 0;font-size:15px;color:var(--tx)"><input type="checkbox" style="width:auto" ${H.off[k]?'':'checked'} onchange="togArea('${k}')"><i style="width:10px;height:10px;border-radius:50%;background:${a.c}"></i>${a.t}</label>`).join('')}</div>`}
function togArea(k){H.off[k]=!H.off[k];save();render()}
const CF=[['name','Firmenname'],['form','Rechtsform'],['street','Straße und Hausnummer'],['zip','PLZ'],['city','Ort'],['tax','Steuernummer / Steuer-ID'],['vat','USt-IdNr.'],['reg','Handelsregister'],['tel','Telefon'],['mail','E-Mail']];
function compH(){return`${back()}<h2 style="margin:14px 0 4px">Mein Unternehmen</h2><p class="sub" style="margin:0 0 16px">Diese Angaben kannst du später für Rechnungen und das Impressum nutzen.</p><div class="card"><div class="rg">${CF.map(([k,l])=>`<div><label>${l}</label><input id="co_${k}" value="${esc(k==='name'?H.company:H.co[k]||'')}"></div>`).join('')}</div><button class="btn p" style="margin-top:14px" onclick="saveComp()">Speichern</button></div>`}
function saveComp(){const n=$('#co_name').value.trim();if(!n){toast('Bitte einen Firmennamen eintragen');return}H.company=n;CF.slice(1).forEach(([k])=>H.co[k]=$('#co_'+k).value.trim());save();toast('Gespeichert');render()}
function teamH(){return`${back()}<h2 style="margin:14px 0 4px">Team &amp; Rollen</h2><p class="sub" style="margin:0 0 16px">Schalte pro Person die Bereiche ein, die sie sehen soll. Beim Planer legst du die höchste Rolle fest, die eine Person haben kann (Visitor, Member oder Owner). Die Rolle im einzelnen Projekt vergibst du weiterhin im Planer unter Projekt, dann Team; die niedrigere der beiden gilt. Änderungen gelten ab dem nächsten Öffnen der App.</p>
${H.users.map(x=>`<div class="card"><div class="row">${av(x)}<div style="flex:1"><b>${esc(x.name)}</b>${x.admin?' <span class="pill">Admin</span>':''}<div class="sub">${esc(x.email)}</div></div>${x.admin?'':`<button class="btn d" onclick="rmU('${x.id}')">Entfernen</button>`}</div>
<div class="rg">${Object.entries(AR).map(([k,a])=>`<div><label><i style="background:${a.c}"></i>${a.t}</label>${x.admin?'<span class="pill">Voller Zugriff</span>':`<label class="tg"><input type="checkbox" ${x.roles[k]!=='none'?'checked':''} onchange="togV('${x.id}','${k}',this.checked)">Sichtbar</label>${x.roles[k]!=='none'&&a.o.length>2?`<select onchange="setR('${x.id}','${k}',this.value)">${a.o.filter(o=>o[0]!=='none').map(o=>`<option value="${o[0]}" ${x.roles[k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:''}`}</div>`).join('')}</div></div>`).join('')}
${REAL?inviteCard():`<div class="card"><h3>Mitarbeiter hinzufügen</h3><div class="rg"><div><label>Name</label><input id="an" placeholder="z. B. Lena"></div><div><label>E-Mail</label><input id="ae" type="email" placeholder="lena@mail.de"></div></div><p class="sub">Neue Personen starten ohne Zugriff. Danach vergibst du oben die Rollen.</p><button class="btn p" onclick="addU()">Hinzufügen</button></div>`}`}
function togV(id,k,on){H.users.find(u=>u.id===id).roles[k]=on?(AR[k].def||AR[k].o[1][0]):'none';save();reset();render()}
function setR(id,k,v){H.users.find(u=>u.id===id).roles[k]=v;save();reset();toast('Rolle gespeichert')}
function rmU(id){if(REAL&&H.sid)sbh.from('members').delete().eq('store_id',H.sid).eq('user_id',id);H.users=H.users.filter(u=>u.id!==id);save();reset();render();toast('Person entfernt')}
function addU(){const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase();if(!n||!e){toast('Name und E-Mail eintragen');return}if(H.users.some(u=>u.email===e)){toast('Diese E-Mail gibt es schon');return}
H.users.push({id:'u'+Math.random().toString(36).slice(2,7),name:n,email:e,color:COL[H.users.length%6],roles:{shop:'none',plan:'none',sched:'none'}});save();reset();render();toast(n+' hinzugefügt')}
addEventListener('popstate',()=>{const h=location.hash.slice(1);if(AR[h]&&me()&&eff(me(),h)!=='none'){V.s='app';V.k=h}else{V.s=h==='profile'||h==='settings'?h:'home'}render()});
{const h=location.hash.slice(1);if(me()&&AR[h]&&eff(me(),h)!=='none'){V.s='app';V.k=h}else if(h==='profile'||h==='settings')V.s=h}
if(REAL)boot();else render();
</script></body></html>
